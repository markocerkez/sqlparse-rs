name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel and install
        shell: bash
        run: |
          python -m pip install maturin pytest "sqlparse==0.6.1"
          maturin build --release -o dist
          python -m pip install --no-index --find-links dist sqlparse-rs
      - name: Unit tests
        run: python -m pytest tests/test_basic.py -q
      - name: Differential test against sqlparse
        shell: bash
        run: |
          python -m pip download "sqlparse==0.6.1" --no-deps --no-binary :all: -d upstream
          mkdir upstream/src && tar xzf upstream/sqlparse-0.6.1.tar.gz -C upstream/src
          python -I tests/diff_test.py upstream/src/sqlparse-0.6.1/tests/files --n-fuzz 20000
      - name: sqlparse's own test suite with the Rust lexer enabled
        shell: bash
        run: |
          cd upstream/src/sqlparse-0.6.1
          python -c "import sqlparse_rs, sys, pytest; sqlparse_rs.patch(); sys.exit(pytest.main(['-q', 'tests']))"
