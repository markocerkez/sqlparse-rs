[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "sqlparse-rs"
version = "0.1.0"
description = "Rust-accelerated lexer and statement splitter for sqlparse"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
dependencies = ["sqlparse>=0.5.0"]
keywords = ["sql", "parser", "sqlparse", "rust"]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/markocerkez/sqlparse-rs"
Upstream = "https://github.com/andialbrecht/sqlparse"

[tool.maturin]
python-source = "python"
module-name = "sqlparse_rs._core"
features = ["pyo3/extension-module"]
