[package]
name = "sqlparse-rs"
version = "0.1.0"
edition = "2021"
description = "Rust-accelerated lexer and statement splitter for sqlparse"
license = "BSD-3-Clause"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py39"] }
rayon = "1.12.0"
rustc-hash = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
